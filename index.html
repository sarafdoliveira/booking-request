<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Good Together · Booking prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  /* Browser-window frame: 1280×900 viewport + 48px chrome, scaled to fit the embed */
  :root{--chrome:#f3f4f7;--line:#e2e4ea;--ink:#25253d;--muted:#7b8093;--W:1280px;--H:900px;--bar:48px}
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .stage{position:absolute;inset:0}
  .win{position:absolute;left:50%;top:50%;width:var(--W);height:calc(var(--H) + var(--bar));transform-origin:center center;overflow:hidden;background:#fff}
  .bar{height:var(--bar);background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;box-sizing:border-box}
  .dots{display:flex;gap:8px;flex:none}
  .dots i{width:12px;height:12px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .nav{display:flex;gap:14px;color:#a3a7b6;flex:none}
  .nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .url{flex:1;max-width:560px;margin:0 auto;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--ink)}
  .url svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2}
  .url span{color:var(--muted)}
  .spacer{width:110px;flex:none}
  iframe{display:block;width:var(--W);height:var(--H);border:0;background:#fff}
</style>
</head>
<body>
  <div class="stage">
    <div class="win" id="win">
      <div class="bar" aria-hidden="true">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="nav"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="url"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Good Together <span>· booking prototype</span></div>
        <div class="spacer"></div>
      </div>
      <iframe src="app.html" title="Good Together booking prototype" allow="autoplay; clipboard-write"></iframe>
    </div>
  </div>
<script>
  (function(){
    var win=document.getElementById('win'), W=1280, H=948, PAD=0;
    function fit(){
      var s=Math.min(innerWidth/W,innerHeight/H);
      win.style.transform='translate(-50%,-50%) scale('+Math.max(s,0.2)+')';
    }
    addEventListener('resize',fit); fit();
  })();
</script>
</body>
</html>
